<!DOCTYPE html>
<html>
<head>
<title>Neon Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background: radial-gradient(circle at center, #020617, #000000);
    overflow: hidden;
}

/* Animated background grid */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image: linear-gradient(rgba(0,255,255,0.1) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,255,255,0.1) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: moveGrid 10s linear infinite;
}

@keyframes moveGrid {
    from { transform: translate(0,0); }
    to { transform: translate(-40px,-40px); }
}

/* Header */
.header {
    margin-top: 30px;
    font-size: 30px;
    color: cyan;
    text-shadow: 0 0 10px cyan, 0 0 20px cyan;
}

/* Container */
.container {
    margin-top: 100px;
}

/* Neon cards */
.card {
    display: inline-block;
    margin: 20px;
    padding: 30px;
    width: 250px;
    border-radius: 15px;
    background: rgba(0,0,0,0.6);
    border: 1px solid cyan;
    box-shadow: 0 0 15px cyan;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px cyan, 0 0 50px blue;
}

/* Links */
a {
    text-decoration: none;
    color: white;
}
</style>

</head>

<body>

<div class="header">☁️ Cloud Security Dashboard</div>

<div class="container">

<a href="/encrypt">
<div class="card">
    <h2>🔐 Encrypt</h2>
    <p>Secure your data</p>
</div>
</a>

<a href="/decrypt">
<div class="card">
    <h2>🔓 Decrypt</h2>
    <p>Recover your data</p>
</div>
</a>

</div>

</body>
</html>
