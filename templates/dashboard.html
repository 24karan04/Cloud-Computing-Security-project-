<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:#020617;
    color:white;
    text-align:center;
}

/* network background */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://www.transparenttextures.com/patterns/cubes.png");
    opacity:0.1;
}

h1{
    margin-top:50px;
    color:#00ccff;
}

.container{
    margin-top:100px;
}

.card{
    display:inline-block;
    width:280px;
    padding:40px;
    margin:30px;
    border-radius:20px;
    background:rgba(0,0,0,0.6);
    box-shadow:0 0 30px rgba(0,255,200,0.3);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.1);
}

.encrypt{
    box-shadow:0 0 30px #00ffcc;
}

.decrypt{
    box-shadow:0 0 30px red;
}

a{
    text-decoration:none;
    color:white;
}
</style>
</head>

<body>

<h1>☁️ Cloud Security Dashboard</h1>

<div class="container">

<a href="/encrypt">
<div class="card encrypt">
<h2>🔐 Encrypt Data</h2>
<p>Secure your data using encryption</p>
</div>
</a>

<a href="/decrypt">
<div class="card decrypt">
<h2>🔓 Decrypt Data</h2>
<p>Recover your encrypted data</p>
</div>
</a>

</div>

</body>
</html>
