<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: cyan;
    text-align: center;
}

/* Neon title */
h1 {
    margin-top: 30px;
    text-shadow: 0 0 10px cyan, 0 0 20px blue;
}

/* Cards */
.card {
    display: inline-block;
    margin: 40px;
    padding: 30px;
    border: 1px solid cyan;
    border-radius: 15px;
    box-shadow: 0 0 15px cyan;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px cyan, 0 0 40px blue;
}

a {
    text-decoration: none;
    color: cyan;
}
</style>

</head>

<body>

<h1>☁️ Cloud Security Dashboard</h1>

<a href="{{ url_for('encrypt') }}">
<div class="card">
    <h2>🔐 Encrypt</h2>
</div>
</a>

<a href="{{ url_for('decrypt') }}">
<div class="card">
    <h2>🔓 Decrypt</h2>
</div>
</a>

</body>
</html>
