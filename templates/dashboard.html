<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<style>
body {
    margin:0;
    font-family: Arial;
    background: radial-gradient(#020617, #000);
    color:white;
    text-align:center;
}

h1 {
    margin-top:40px;
    color:#00eaff;
    text-shadow:0 0 20px #00eaff;
}

.container {
    display:flex;
    justify-content:center;
    gap:50px;
    margin-top:100px;
}

.card {
    width:280px;
    padding:40px;
    border-radius:20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    transition:0.4s;
}

.card:hover {
    transform:scale(1.1);
}

.encrypt {
    border:1px solid #00ffcc;
    box-shadow:0 0 20px #00ffcc;
}

.decrypt {
    border:1px solid #ff0033;
    box-shadow:0 0 20px #ff0033;
}

a {
    text-decoration:none;
    color:white;
}
</style>
</head>

<body>

<h1>☁️ Cloud Security Dashboard</h1>

<div class="container">

<a href="/encrypt">
<div class="card encrypt">
<h2>🔐 Encrypt Data</h2>
<p>Secure your data</p>
</div>
</a>

<a href="/decrypt">
<div class="card decrypt">
<h2>🔓 Decrypt Data</h2>
<p>Recover your data</p>
</div>
</a>

</div>

</body>
</html>
