<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Security Dashboard</title>
    <style>
        :root {
            --bg-dark: #020617;
            --neon-blue: #00ccff;
            --neon-green: #00ffcc;
            --neon-red: #ff4d4d;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- PURE CSS ANIMATED BACKGROUND --- */
        .bg-animation {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            overflow: hidden;
        }

        /* Moving Grid Lines */
        .bg-animation::before {
            content: "";
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: 
                linear-gradient(rgba(0, 204, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 204, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 10s linear infinite;
        }

        /* Glowing Data Particles */
        .particles {
            position: absolute;
            width: 100%; height: 100%;
            background: transparent;
        }

        .particle {
            position: absolute;
            background: var(--neon-blue);
            border-radius: 50%;
            opacity: 0.5;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: fly 5s infinite linear;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        @keyframes fly {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* --- DASHBOARD UI STYLES --- */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.4s; }
        .active { display: flex; }
        
        h1 { font-size: 2.8rem; margin-bottom: 40px; text-shadow: 0 0 15px var(--neon-blue); }
        h1 span { color: #8b5cf6; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 30px;
            width: 320px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .enc-card:hover { border-color: var(--neon-green); box-shadow: 0 0 40px rgba(0, 255, 204, 0.4); transform: translateY(-10px); }
        .dec-card:hover { border-color: var(--neon-red); box-shadow: 0 0 40px rgba(255, 77, 77, 0.4); transform: translateY(-10px); }

        .loader {
            border: 6px solid rgba(255,255,255,0.1);
            border-radius: 50%; width: 80px; height: 80px;
            margin: 20px auto; animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Animated Background Layer -->
    <div class="bg-animation">
        <div class="particles" id="particle-container"></div>
    </div>

    <!-- STEP 1: Main Dashboard -->
    <div id="step1" class="screen active">
        <h1>☁️ Cloud Security <span>Dashboard</span></h1>
        <div style="display:flex; gap: 40px;">
            <div class="glass-card enc-card" onclick="changeScreen('step2')">
                <div style="font-size:3rem; color:var(--neon-green); margin-bottom:15px;">🔒</div>
                <h2>Encrypt Data</h2>
                <p>Secure your data using encryption</p>
            </div>
            <div class="glass-card dec-card" onclick="changeScreen('step3')">
                <div style="font-size:3rem; color:var(--neon-red); margin-bottom:15px;">🔓</div>
                <h2>Decrypt Data</h2>
                <p>Recover your encrypted data</p>
            </div>
        </div>
    </div>

    <!-- Additional steps (step2/step3) go here following the same structure -->

    <script>
        // Generate random floating particles for the "Cyber" look
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = p.style.height = Math.random() * 5 + 2 + 'px';
            p.style.animationDuration = Math.random() * 3 + 2 + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }

        function changeScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
