<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    /* Modern gradient background */
    background: linear-gradient(135deg, #020617, #0f172a, #1e3a8a);
    height: 100vh;
}

/* Header */
.header {
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
}

/* Container */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 70vh;
    gap: 40px;
}

/* Glass cards */
.card {
    width: 260px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 25px rgba(0, 150, 255, 0.2);
    transition: 0.3s;
    cursor: pointer;
}

/* Hover animation */
.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 30px rgba(0,150,255,0.6);
}

/* Titles */
.card h2 {
    margin-bottom: 10px;
}

/* Description */
.card p {
    font-size: 14px;
    opacity: 0.8;
}

/* Remove link style */
a {
    text-decoration: none;
    color: white;
}
</style>

</head>

<body>

<div class="header">
    ☁️ Cloud Security Dashboard
</div>

<div class="container">

    <!-- Encrypt Card -->
    <a href="/encrypt">
        <div class="card">
            <h2>🔐 Encrypt Data</h2>
            <p>Secure your data using encryption</p>
        </div>
    </a>

    <!-- Decrypt Card -->
    <a href="/decrypt">
        <div class="card">
            <h2>🔓 Decrypt Data</h2>
            <p>Recover your encrypted data</p>
        </div>
    </a>

</div>

</body>
</html>
