<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#020617,#0f172a);
    color:white;
}

/* soft background dots (clean, not ugly) */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.3;
}

/* MAIN CARD */
.container{
    position:relative;
    width:420px;
    padding:40px;
    border-radius:18px;
    background: rgba(15,23,42,0.9);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
}

/* TITLE */
h1{
    color:#60a5fa;
    margin-bottom:5px;
}

.sub{
    color:#9ca3af;
    margin-bottom:25px;
}

/* INPUT */
.input-box{
    text-align:left;
    margin-bottom:15px;
}

.input-box label{
    font-size:14px;
    color:#cbd5f5;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #334155;
    background:#020617;
    color:white;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background: linear-gradient(90deg,#4facfe,#6366f1);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.btn:hover{
    opacity:0.9;
}

/* FOOTER */
.footer{
    margin-top:20px;
    color:#9ca3af;
    font-size:14px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>☁️ Cloud Security</h1>
<p class="sub">Secure your data in the cloud</p>

<h2>Create Account</h2>

<form method="POST">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name">
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" name="username" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" placeholder="Create password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" placeholder="Confirm password">
</div>

<button class="btn">Register</button>

</form>

<div class="footer">
Already have an account? <a href="/login">Login</a>
</div>

</div>

</body>
</html>
