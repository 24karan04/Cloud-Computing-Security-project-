<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* ===== REAL CYBER BACKGROUND ===== */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
        url('/static/images/Cloud register page.png') no-repeat center center/cover;
    color:white;
    overflow:hidden;
}

/* ===== SUBTLE ANIMATION (NOT UGLY) ===== */
body::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 20% 30%, rgba(0,200,255,0.2), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,150,255,0.2), transparent 40%);
    animation: moveLight 8s ease-in-out infinite alternate;
}

@keyframes moveLight{
    from{transform:translate(0,0);}
    to{transform:translate(20px,-20px);}
}

/* ===== GLASS CARD ===== */
.container{
    position:relative;
    width:420px;
    padding:40px;
    border-radius:16px;
    background: rgba(10,15,30,0.85);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    text-align:center;
    z-index:2;
}

/* ===== TEXT ===== */
h1{
    color:#4facfe;
}

.sub{
    color:#aaa;
    margin-bottom:20px;
}

/* ===== INPUT ===== */
.input-box{
    text-align:left;
    margin-bottom:15px;
}

label{
    font-size:14px;
    color:#ccc;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #2a3a5a;
    background:#020617;
    color:white;
}

/* ===== BUTTON ===== */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background: linear-gradient(90deg,#4facfe,#6366f1);
    color:white;
    font-weight:600;
    cursor:pointer;
}

.footer{
    margin-top:20px;
    color:#aaa;
}

a{
    color:#4facfe;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>☁️ Cloud Security</h1>
<p class="sub">Secure your data in the cloud</p>

<h2>Create Account</h2>

<form method="POST">

<div class="input-box">
<label>Email</label>
<input type="email" name="username" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" required>
</div>

<button class="btn">Register</button>

</form>

<div class="footer">
Already have account? <a href="/login">Login</a>
</div>

</div>

</body>
</html>
