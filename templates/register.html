<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at center,#020617,#000);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* glowing particles */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background-image: radial-gradient(#00ccff33 1px, transparent 1px);
    background-size: 40px 40px;
    opacity:0.3;
}

.container{
    width:420px;
    padding:40px;
    border-radius:20px;
    background:rgba(10,15,30,0.8);
    backdrop-filter: blur(15px);
    box-shadow:0 0 40px rgba(0,200,255,0.2);
    text-align:center;
}

h1{
    margin:10px 0;
    color:#5cc8ff;
}

.sub{
    color:#aaa;
    margin-bottom:20px;
}

/* inputs */
.input-box{
    margin:15px 0;
    text-align:left;
}

.input-box input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #2a3a5a;
    background:#0b1224;
    color:white;
}

/* button */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#4facfe,#8e44ad);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* links */
a{
    color:#5cc8ff;
    text-decoration:none;
}

.footer{
    margin-top:20px;
    color:#aaa;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>☁️ Cloud Security</h1>
<p class="sub">Secure your data in the cloud</p>

<h2>Create Account</h2>

<form method="POST">

<div class="input-box">
<label>Full Name</label>
<input type="text" name="name" placeholder="Enter your full name">
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" name="username" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" placeholder="Create password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password" placeholder="Confirm password">
</div>

<button class="btn">Register</button>

</form>

<div class="footer">
Already have account? <a href="/login">Login here</a>
</div>

</div>

</body>
</html>
