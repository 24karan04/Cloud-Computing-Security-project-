<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* ===== ANIMATED GRADIENT BACKGROUND ===== */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
    background: linear-gradient(-45deg, #020617, #0f172a, #020617, #1e293b);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== PARTICLES (SUBTLE) ===== */
.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:#60a5fa;
    border-radius:50%;
    opacity:0.6;
    animation: float 10s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* ===== GLASS CARD ===== */
.container{
    position:relative;
    width:420px;
    padding:40px;
    border-radius:18px;
    background: rgba(15,23,42,0.85);
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    text-align:center;
    z-index:2;
}

/* ===== TEXT ===== */
h1{
    color:#60a5fa;
    margin-bottom:5px;
}

.sub{
    color:#9ca3af;
    margin-bottom:25px;
}

/* ===== INPUT ===== */
.input-box{
    text-align:left;
    margin-bottom:15px;
}

label{
    font-size:14px;
    color:#cbd5f5;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #334155;
    background:#020617;
    color:white;
}

/* ===== BUTTON ===== */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    background: linear-gradient(90deg,#4facfe,#6366f1);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

/* ===== FOOTER ===== */
.footer{
    margin-top:20px;
    color:#9ca3af;
    font-size:14px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}
</style>

</head>

<body>

<!-- PARTICLES SCRIPT -->
<script>
for(let i=0;i<40;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(6+Math.random()*6)+"s";
    document.body.appendChild(p);
}
</script>

<div class="container">

<h1>☁️ Cloud Security</h1>
<p class="sub">Secure your data in the cloud</p>

<h2>Create Account</h2>

<form method="POST">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name">
</div>

<div class="input-box">
<label>Email Address</label>
<input type="email" name="username" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" required>
</div>

<div class="input-box">
<label>Confirm Password</label>
<input type="password">
</div>

<button class="btn">Register</button>

</form>

<div class="footer">
Already have account? <a href="/login">Login</a>
</div>

</div>

</body>
</html>
