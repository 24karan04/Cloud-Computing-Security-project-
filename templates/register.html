<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

/* ===== BODY ===== */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
    overflow:hidden;
    color:white;
}

/* ===== GRID ANIMATION ===== */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background-image:
        linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px);
    background-size:40px 40px;
    animation: moveGrid 12s linear infinite;
}

@keyframes moveGrid{
    from{transform:translate(0,0);}
    to{transform:translate(-40px,-40px);}
}

/* ===== PARTICLES ===== */
.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#00ffff;
    border-radius:50%;
    animation: float 10s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* ===== GLASS CARD ===== */
.container{
    position:relative;
    width:420px;
    padding:40px;
    border-radius:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(15px);
    box-shadow:0 0 50px rgba(0,255,255,0.3);
    text-align:center;
    z-index:2;
}

/* ===== TITLE ===== */
h1{
    color:#00ffff;
    text-shadow:0 0 20px #00ffff;
}

/* ===== INPUT ===== */
.input-box{
    margin:15px 0;
    text-align:left;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #00ffff44;
    background:#0b1224;
    color:white;
}

/* ===== BUTTON ANIMATION ===== */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#00ffff,#0077ff,#00ffff);
    background-size:200%;
    animation: glowBtn 3s linear infinite;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

@keyframes glowBtn{
    0%{background-position:0%}
    100%{background-position:200%}
}

/* ===== LINK ===== */
a{
    color:#00ffff;
    text-decoration:none;
}

.footer{
    margin-top:20px;
    color:#aaa;
}
</style>

</head>

<body>

<!-- PARTICLES -->
<script>
for(let i=0;i<60;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*5)+"s";
    document.body.appendChild(p);
}
</script>

<!-- CARD -->
<div class="container">

<h1>☁️ Cloud Security</h1>
<p>Secure your data in the cloud</p>

<h2>Create Account</h2>

<form method="POST">

<div class="input-box">
<input type="email" name="username" placeholder="Email" required>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="Password" required>
</div>

<button class="btn">Register</button>

</form>

<div class="footer">
Already have account? <a href="/login">Login</a>
</div>

</div>

</body>
</html>
