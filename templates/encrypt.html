<!DOCTYPE html>
<html>
<head>
<title>Encrypt</title>

<style>
body {
    background: black;
    color: cyan;
    text-align: center;
    font-family: Arial;
}

h1 {
    margin-top: 50px;
    text-shadow: 0 0 10px cyan;
}

input, button {
    padding: 12px;
    margin: 10px;
    width: 250px;
    background: black;
    border: 1px solid cyan;
    color: cyan;
}

button {
    cursor: pointer;
}
</style>

</head>

<body>

<h1>🔐 Encryption</h1>

<form action="/encrypt" method="post">
    <input type="text" name="text" placeholder="Enter text" required><br>
    <button type="submit">Encrypt</button>
</form>

{% if result %}
<p>Encrypted: {{ result }}</p>
{% endif %}

<br>
<a href="/dashboard">⬅ Back</a>

</body>
</html>
