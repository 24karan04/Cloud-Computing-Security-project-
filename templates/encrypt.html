<!DOCTYPE html>
<html>
<head>
<style>
    :root { --neon: #00ffcc; --bg: #020617; }
    body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Segoe UI'; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
    /* Animated Grid Background */
    .bg-grid { position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background-image: linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(60deg); animation: move 12s linear infinite; z-index: -1; }
    @keyframes move { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px); } }
    .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 20px; padding: 50px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); animation: fadeIn 0.6s ease; text-align: center; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    input { padding: 15px; width: 300px; background: rgba(0,0,0,0.5); border: 1px solid var(--neon); color: var(--neon); border-radius: 8px; margin-bottom: 15px; outline: none; }
    button { padding: 15px; width: 332px; background: var(--neon); color: black; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    button:hover { box-shadow: 0 0 20px var(--neon); transform: scale(1.02); }
</style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glass-panel">
        <h1>🔐 Encryption Process</h1>
        <form method="POST">
            <input name="text" placeholder="Enter text to encrypt" required><br>
            <button>Encrypt Data</button>
        </form>
    </div>
</body>
</html>
