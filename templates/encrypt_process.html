<!DOCTYPE html>
<html>
<head>
<style>
    :root { --neon: #00ffcc; --bg: #020617; }
    body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Segoe UI'; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
    .loader { width: 120px; height: 120px; border: 8px solid rgba(255,255,255,0.1); border-top: 8px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px var(--neon); }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
    <h1>Encrypting your data...</h1>
    <div class="loader"></div>
    <p>Securing packets for Cloud Storage</p>
    <script>
        setTimeout(()=>{ window.location="/encrypt_result?text={{text}}" }, 2000)
    </script>
</body>
</html>
