<!DOCTYPE html>
<html>
<head>
<style>
body{
    background:#020617;
    color:#00ffcc;
    text-align:center;
    font-family:Segoe UI;
}

/* circle loader */
.circle{
    width:200px;
    height:200px;
    border:10px solid #00ffcc;
    border-top:10px solid transparent;
    border-radius:50%;
    margin:150px auto;
    animation:spin 2s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<h1>Encrypting your data...</h1>
<div class="circle"></div>

<script>
setTimeout(()=>{
    window.location="/encrypt_result?text={{text}}"
},2000)
</script>

</body>
</html>
