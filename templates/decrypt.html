<!DOCTYPE html>
<html>
<head>
<title>Decrypt</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #020617, #1e293b);
}

.title {
    margin-top: 50px;
    font-size: 30px;
    color: #38bdf8;
}

.box {
    margin-top: 80px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 15px;
    display: inline-block;
}

input {
    padding: 12px;
    width: 250px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px;
    width: 270px;
    background: #ef4444;
    border: none;
    border-radius: 8px;
    color: white;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="title">🔓 Decryption Process</div>

<div class="box">
    <form action="/decrypt" method="post">
        <input type="text" name="text" placeholder="Enter text to decrypt" required><br>
        <button type="submit">Decrypt</button>
    </form>
</div>

</body>
</html>
