<!DOCTYPE html>
<html>
<head>
<title>Decrypt</title>

<style>
body {
    background: black;
    color: #00ff99;
    text-align: center;
    font-family: Arial;
}

h1 {
    margin-top: 50px;
}

input, button {
    padding: 12px;
    margin: 10px;
    width: 250px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
}

button {
    cursor: pointer;
}
</style>

</head>

<body>

<h1>🔓 Decryption</h1>

<form action="/decrypt" method="post">
    <input type="text" name="text" placeholder="Enter text" required><br>
    <button type="submit">Decrypt</button>
</form>

{% if result %}
<p>Decrypted: {{ result }}</p>
{% endif %}

<br>
<a href="/dashboard">⬅ Back</a>

</body>
</html>
