<!DOCTYPE html>
<html>
<head>
<title>Decrypt</title>

<style>
body {
    margin: 0;
    background: black;
    color: #00ff99;
    text-align: center;
    font-family: Arial;
}

h1 {
    margin-top: 50px;
    text-shadow: 0 0 10px #00ff99;
}

.box {
    margin-top: 80px;
}

input {
    padding: 12px;
    width: 250px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    border-radius: 5px;
}

button {
    padding: 12px;
    width: 270px;
    margin-top: 10px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: 0 0 10px #00ff99;
}

button:hover {
    box-shadow: 0 0 20px #00ff99;
}

.result {
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>🔓 Decryption</h1>

<div class="box">
    <form action="/decrypt" method="post">
        <input type="text" name="text" placeholder="Enter text" required><br>
        <button type="submit">Decrypt</button>
    </form>

    {% if result %}
    <div class="result">
        Decrypted: {{ result }}
    </div>
    {% endif %}

    <br><br>
    <a href="/dashboard" style="color:#00ff99;">⬅ Back</a>
</div>

</body>
</html>
