<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

/* BACKGROUND IMAGE */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: url("{{ url_for('static', filename='Cloud login page.png') }}") no-repeat center center/cover;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
}

/* GLASS CARD */
.container{
    position:relative;
    width:400px;
    padding:40px;
    border-radius:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(15px);
    box-shadow:0 0 40px rgba(0,200,255,0.3);
    color:white;
    text-align:center;
}

/* TITLE */
h1{
    color:#5cc8ff;
    margin-bottom:5px;
}

.sub{
    color:#aaa;
    margin-bottom:20px;
}

/* INPUT */
.input-box{
    margin:15px 0;
    text-align:left;
}

.input-box label{
    font-size:14px;
    color:#ccc;
}

.input-box input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:10px;
    border:1px solid #2a3a5a;
    background:#0b1224;
    color:white;
}

/* BUTTON */
.btn{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background: linear-gradient(90deg,#4facfe,#8e44ad);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* LINKS */
.links{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

a{
    color:#5cc8ff;
    text-decoration:none;
}

/* FOOTER */
.footer{
    margin-top:20px;
    color:#aaa;
}
</style>

</head>

<body>

<div class="container">

<h1>☁️ Cloud Security</h1>
<p class="sub">Secure your data in the cloud</p>

<h2>Welcome Back</h2>

<form method="POST">

<div class="input-box">
<label>Email Address</label>
<input type="email" name="username" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
</div>

<div class="links">
<label><input type="checkbox"> Remember me</label>
<a href="/forgot_password">Forgot Password?</a>
</div>

<button class="btn">Login</button>

</form>

<div class="footer">
Don't have account? <a href="/register">Register here</a>
</div>

</div>

</body>
</html>
