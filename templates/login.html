<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    /* Gradient background (no image needed) */
    background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
    height: 100vh;
}

/* Center the box */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass effect box */
.box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 25px rgba(0, 150, 255, 0.3);
    width: 300px;
}

/* Headings */
h1 {
    margin-bottom: 5px;
}

h2 {
    margin-top: 0;
    color: #38bdf8;
}

/* Inputs */
input {
    padding: 12px;
    margin: 10px 0;
    width: 100%;
    border-radius: 8px;
    border: none;
    outline: none;
}

/* Button */
button {
    padding: 12px;
    width: 100%;
    background: linear-gradient(45deg, #38bdf8, #0ea5e9);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

/* Link */
a {
    color: #38bdf8;
    text-decoration: none;
}
</style>

</head>

<body>

<div class="container">
    <div class="box">

        <h1>☁️ Cloud Security Project</h1>
        <h2>🔐 Login</h2>

        <form action="/login_user" method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?</p>
        <a href="/register">Register here</a>

    </div>
</div>

</body>
</html>
